<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            font-family: 'Arial', sans-serif;
        }
        .header {
            background-color: #3f51b5;
            color: white;
            padding: 20px 0;
            margin-bottom: 30px;
            border-radius: 0 0 10px 10px;
        }
        .school-card {
            transition: all 0.3s ease;
            margin-bottom: 15px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .school-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .school-list {
            max-height: 600px;
            overflow-y: auto;
            padding-right: 10px;
        }
        .form-container {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn-add {
            background-color: #4caf50;
            border: none;
            width: 100%;
            padding: 10px;
        }
        .btn-remove {
            background-color: #f44336;
            border: none;
        }
        .no-schools {
            text-align: center;
            padding: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header text-center">
        <h1>School Management System</h1>
        <p class="lead">Add and manage schools in your district</p>
    </div>

    <div class="container">
        <div class="row">
            <!-- Add School Form -->
            <div class="col-md-5">
                <div class="form-container">
                    <h2 class="mb-4">Add New School</h2>
                    <form id="addSchoolForm">
                        <div class="mb-3">
                            <label for="schoolName" class="form-label">School Name *</label>
                            <input type="text" class="form-control" id="schoolName" required>
                        </div>
                        <div class="mb-3">
                            <label for="schoolAddress" class="form-label">Address *</label>
                            <input type="text" class="form-control" id="schoolAddress" required>
                        </div>
                        <div class="mb-3">
                            <label for="schoolType" class="form-label">School Type</label>
                            <select class="form-select" id="schoolType">
                                <option value="Public">Public</option>
                                <option value="Private">Private</option>
                                <option value="Charter">Charter</option>
                                <option value="International">International</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="studentCount" class="form-label">Student Count</label>
                                <input type="number" class="form-control" id="studentCount">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="establishedYear" class="form-label">Established Year</label>
                                <input type="number" class="form-control" id="establishedYear" min="1900" max="2099">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-add btn-success">Add School</button>
                    </form>
                </div>
            </div>

            <!-- School List -->
            <div class="col-md-7">
                <h2 class="mb-4">School List</h2>
                <div id="schoolsContainer" class="school-list">
                    <!-- Schools will be dynamically added here -->
                    <div id="noSchoolsMessage" class="no-schools">
                        <p>No schools added yet. Add your first school!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
